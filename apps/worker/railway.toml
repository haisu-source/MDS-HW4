# Railway service config for the polling worker.
# Create the service in Railway with "Root Directory" = apps/worker and these
# commands will be picked up automatically.

[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build --workspace worker"

[deploy]
startCommand = "node apps/worker/dist/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
